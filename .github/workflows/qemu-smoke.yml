name: QEMU smoke

on:
  push:
    branches: [main]
    paths:
      - '.cargo/**'
      - '.github/workflows/qemu-smoke.yml'
      - 'boot/**'
      - 'crates/boot/**'
      - 'crates/hull/**'
      - 'crates/keel/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths:
      - '.cargo/**'
      - '.github/workflows/qemu-smoke.yml'
      - 'boot/**'
      - 'crates/boot/**'
      - 'crates/hull/**'
      - 'crates/keel/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NIGHTLY: nightly-2026-06-01

jobs:
  x86_64:
    name: x86_64 PVH boot window
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install QEMU x86
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${{ env.NIGHTLY }}" --profile minimal \
            --component rust-src \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview \
            --target x86_64-unknown-none \
            --target aarch64-unknown-none-softfloat

      - name: Cache cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-qemu-x86-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'boot/**', 'crates/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-qemu-x86-
            ${{ runner.os }}-cargo-

      - name: Time-boxed x86_64 QEMU smoke
        run: |
          set +e
          set -o pipefail
          mkdir -p target
          timeout --kill-after=5s 45s cargo +${{ env.NIGHTLY }} shipwright -- qemu > target/qemu-x86_64-serial.log 2>&1
          status=$?
          cat target/qemu-x86_64-serial.log
          set -e
          if [ "${status}" -eq 124 ] \
            && grep -Fq 'keel: PHASE2: IPC_ROUNDTRIP PASS (payload 0xf70dca11)' target/qemu-x86_64-serial.log \
            && grep -Fq 'keel: early console up; entering idle (Phase 2 boot pending).' target/qemu-x86_64-serial.log; then
            echo 'QEMU reached the verified Phase 2 IPC and boot sentinels within the smoke-test window.'
            exit 0
          fi
          if [ "${status}" -eq 124 ]; then
            echo 'QEMU timed out before the verified Phase 2 IPC and boot sentinels.' >&2
          fi
          exit "${status}"

      - name: Upload QEMU guest logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-x86_64-log
          path: |
            target/qemu-fjord.log
            target/qemu-x86_64-serial.log
          if-no-files-found: ignore

  aarch64:
    name: aarch64 virt boot window
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install QEMU aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${{ env.NIGHTLY }}" --profile minimal \
            --component rust-src \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview \
            --target x86_64-unknown-none \
            --target aarch64-unknown-none-softfloat

      - name: Cache cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-qemu-aarch64-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'boot/**', 'crates/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-qemu-aarch64-
            ${{ runner.os }}-cargo-

      - name: Time-boxed aarch64 QEMU smoke
        run: |
          set +e
          set -o pipefail
          mkdir -p target
          timeout --kill-after=5s 45s scripts/qemu-aarch64.sh -no-reboot > target/qemu-aarch64-serial.log 2>&1
          status=$?
          cat target/qemu-aarch64-serial.log
          set -e
          if [ "${status}" -eq 124 ] \
            && grep -Fq 'keel: PHASE2: IPC_ROUNDTRIP PASS (payload 0xf70dca11)' target/qemu-aarch64-serial.log \
            && grep -Fq 'keel: early console up; entering idle (Phase 2 boot pending).' target/qemu-aarch64-serial.log; then
            echo 'QEMU reached the verified Phase 2 IPC and boot sentinels within the smoke-test window.'
            exit 0
          fi
          if [ "${status}" -eq 124 ]; then
            echo 'QEMU timed out before the verified Phase 2 IPC and boot sentinels.' >&2
          fi
          exit "${status}"

      - name: Upload aarch64 QEMU serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-aarch64-log
          path: target/qemu-aarch64-serial.log
          if-no-files-found: ignore
